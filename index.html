<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaZone - Top Trending Amazon Deals</title>
    <meta name="description" content="Discover top trending Amazon deals updated daily.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-badge">⚡</span>
            <h1>NovaZone</h1>
        </div>
        <p>Trending Products & Smart Everyday Essentials</p>
    </header>

    <nav class="categories">
        <button class="tab-btn active" onclick="filterCategory('all')">All Deals</button>
        <button class="tab-btn" onclick="filterCategory('tech')">⚡ Tech</button>
        <button class="tab-btn" onclick="filterCategory('kitchen')">🍳 Kitchen</button>
        <button class="tab-btn" onclick="filterCategory('beauty')">💄 Beauty</button>
        <button class="tab-btn" onclick="filterCategory('fashion')">👗 Fashion</button>
        <button class="tab-btn" onclick="filterCategory('shoes')">👟 Shoes</button>
        <button class="tab-btn" onclick="filterCategory('toys')">🧸 Baby Toys</button>
        <button class="tab-btn" onclick="filterCategory('innerwear')">🩲 Innerwear & Lingerie</button>
    </nav>

    <main id="deals-container" class="grid-container"></main>

    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-num">Page 1</span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>

    <footer>
        <p>&copy; 2026 NovaZone. As an Amazon Associate, we earn from qualifying purchases.</p>
    </footer>

    <script>
        let allDeals = [];
        let filteredDeals = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        async function loadDeals() {
            try {
                const response = await fetch('deals.json');
                allDeals = await response.json();
                filteredDeals = [...allDeals];
                renderPage();
            } catch (error) {
                console.error('Error loading deals:', error);
            }
        }

        function renderPage() {
            const container = document.getElementById('deals-container');
            container.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredDeals.slice(start, end);

            paginatedItems.forEach((deal) => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.innerHTML = `
                    <div class="img-box">
                        <img src="${deal.image}" alt="${deal.title}" loading="lazy">
                    </div>
                    <div>
                        <div class="brand-name">${deal.brand || 'AMAZON'}</div>
                        <h3 class="product-title">${deal.title}</h3>
                        <div class="rating-box">
                            <span class="stars">★ ${deal.rating || '4.6'}</span>
                            <span class="review-count">(${deal.reviews || '10K'})</span>
                        </div>
                        <div class="bought-text">${deal.bought || '10K+ bought in past month'}</div>
                        <div class="price-box">
                            ${deal.price}
                            ${deal.listPrice ? `<span class="list-price">List: ${deal.listPrice}</span>` : ''}
                        </div>
                        <div class="delivery-text">Delivery <strong>${deal.delivery || 'Fast Delivery'}</strong></div>
                        <div class="ship-text">Eligible for International Shipping</div>
                    </div>
                    <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="buy-btn">View on Amazon</a>
                `;
                container.appendChild(card);
            });

            document.getElementById('page-num').innerText = `Page ${currentPage} of ${Math.ceil(filteredDeals.length / itemsPerPage) || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= filteredDeals.length;
        }

        function changePage(direction) {
            currentPage += direction;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            
            if (category === 'all') {
                filteredDeals = [...allDeals];
            } else {
                filteredDeals = allDeals.filter(deal => deal.category === category);
            }
            currentPage = 1;
            renderPage();
        }

        loadDeals();
    </script>
</body>
</html>
