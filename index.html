<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaZone - Top Trending Amazon Deals & Smart Essentials</title>
    <meta name="description" content="Discover top trending Amazon deals on Tech Gadgets, Home Appliances, Beauty, and Fashion updated daily.">
    <meta name="keywords" content="Amazon deals, trending tech, best home gadgets, beauty deals, fashion discounts">
    
    <!-- FAVICON (Browser Tab Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">

    <!-- OpenGraph SEO -->
    <meta property="og:title" content="NovaZone - Top Trending Amazon Deals">
    <meta property="og:description" content="Handpicked daily trending Amazon deals across Tech, Home, Beauty & Fashion.">
    <meta property="og:type" content="website">

    <!-- Schema.org JSON-LD SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NovaZone",
      "url": "https://adil-leo.github.io/novazone/",
      "description": "Daily automated Amazon trending deals aggregator"
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-badge">⚡</span>
            <h1>NovaZone</h1>
        </div>
        <p>Google Trends Powered Amazon Deals</p>
    </header>

    <nav class="categories">
        <button class="tab-btn active" onclick="filterCategory('all')">All Deals</button>
        <button class="tab-btn" onclick="filterCategory('tech')">⚡ Tech & Gadgets</button>
        <button class="tab-btn" onclick="filterCategory('home')">🏠 Home & Kitchen</button>
        <button class="tab-btn" onclick="filterCategory('beauty')">💄 Beauty & Care</button>
        <button class="tab-btn" onclick="filterCategory('fashion')">👕 Fashion</button>
    </nav>

    <main id="deals-container" class="grid-container"></main>

    <!-- Pagination Controls -->
    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-num">Page 1</span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>

    <footer>
        <p>&copy; 2026 NovaZone. As an Amazon Associate, we earn from qualifying purchases.</p>
    </footer>

    <script>
        let currentDeals = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        async function loadDeals() {
            try {
                const response = await fetch('deals.json');
                currentDeals = await response.json();
                renderPage();
            } catch (error) {
                console.error('Error loading deals:', error);
            }
        }

        function renderPage() {
            const container = document.getElementById('deals-container');
            container.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = currentDeals.slice(start, end);

            paginatedItems.forEach(deal => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.innerHTML = `
                    <img src="${deal.image}" alt="${deal.title}" loading="lazy">
                    <h3>${deal.title}</h3>
                    <p class="price">${deal.price}</p>
                    <a href="${deal.link}" target="_blank" class="buy-btn">Buy Now</a>
                `;
                container.appendChild(card);
            });

            document.getElementById('page-num').innerText = `Page ${currentPage} of ${Math.ceil(currentDeals.length / itemsPerPage) || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= currentDeals.length;
        }

        function changePage(direction) {
            currentPage += direction;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            fetch('deals.json')
                .then(res => res.json())
                .then(data => {
                    if (category === 'all') {
                        currentDeals = data;
                    } else {
                        currentDeals = data.filter(deal => deal.category === category);
                    }
                    currentPage = 1;
                    renderPage();
                });
        }

        loadDeals();
    </script>
</body>
</html>
