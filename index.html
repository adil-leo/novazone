<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaZone - Amazon Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>⚡ NovaZone</h1>
        </div>
        <p>Top Trending Deals Updated Daily</p>
    </header>

    <nav class="categories">
        <button class="tab-btn active" onclick="filterCategory('all', event)">All Deals</button>
        <button class="tab-btn" onclick="filterCategory('tech', event)">⚡ Tech</button>
        <button class="tab-btn" onclick="filterCategory('kitchen', event)">🍳 Kitchen</button>
        <button class="tab-btn" onclick="filterCategory('beauty', event)">💄 Beauty</button>
        <button class="tab-btn" onclick="filterCategory('fashion', event)">👗 Fashion</button>
        <button class="tab-btn" onclick="filterCategory('shoes', event)">👟 Shoes</button>
        <button class="tab-btn" onclick="filterCategory('toys', event)">🧸 Baby Toys</button>
        <button class="tab-btn" onclick="filterCategory('innerwear', event)">🩲 Innerwear</button>
    </nav>

    <main id="deals-container" class="grid-container"></main>

    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-num">Page 1</span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>

    <footer>
        <p>&copy; 2026 NovaZone. As an Amazon Associate, we earn from qualifying purchases.</p>
    </footer>

    <script>
        let allDeals = [];
        let filteredDeals = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        async function loadDeals() {
            try {
                const response = await fetch('deals.json');
                allDeals = await response.json();
                filteredDeals = [...allDeals];
                renderPage();
            } catch (error) {
                console.error('Error loading deals:', error);
            }
        }

        function renderPage() {
            const container = document.getElementById('deals-container');
            container.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredDeals.slice(start, end);

            paginatedItems.forEach((deal) => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.innerHTML = `
                    <div class="img-box">
                        <img src="${deal.image}" alt="${deal.title}" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500';">
                    </div>
                    <div>
                        <div class="brand-name">${deal.brand || 'AMAZON'}</div>
                        <h3 class="product-title" title="${deal.title}">${deal.title}</h3>
                        <div class="rating-box">★ ${deal.rating || '4.6'} (${deal.reviews || '10K'})</div>
                        <div class="price-box">${deal.price}</div>
                    </div>
                    <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="buy-btn">Buy on Amazon</a>
                `;
                container.appendChild(card);
            });

            document.getElementById('page-num').innerText = `Page ${currentPage} of ${Math.ceil(filteredDeals.length / itemsPerPage) || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= filteredDeals.length;
        }

        function changePage(direction) {
            currentPage += direction;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(category, e) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(e && e.target) e.target.classList.add('active');
            
            if (category === 'all') {
                filteredDeals = [...allDeals];
            } else {
                filteredDeals = allDeals.filter(deal => deal.category === category);
            }
            currentPage = 1;
            renderPage();
        }

        loadDeals();
    </script>
</body>
</html>
